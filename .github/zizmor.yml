# https://docs.zizmor.sh/configuration/
rules:
  dependabot-cooldown:
    config:
      # Dependabot waits 3 days for a new release, the same as its own default
      days: 3
  unpinned-uses:
    config:
      policies:
        # The shared workflows of the owner of the repository go by their version tag.
        "ALERTua/*": ref-pin
        # Each other action goes by its full commit hash, which Dependabot updates with the version comment.
        "*": hash-pin
