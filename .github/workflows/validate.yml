name: "Validate"

on:
  workflow_dispatch:
#  schedule:
#    - cron: "0 0 * * *"
  push:
    branches:
      - "main"
      - "dev"

  pull_request:
    branches:
      - "main"
      - "dev"

permissions: {}

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read  # checkout
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run hassfest validation"
        # Home Assistant publishes hassfest only on the master branch, and it must follow the newest rules
        uses: "home-assistant/actions/hassfest@master" # zizmor: ignore[unpinned-uses]

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read  # checkout
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run HACS validation"
        # the last release of hacs/action is from 2022, HACS documents the main branch
        uses: "hacs/action@main" # zizmor: ignore[unpinned-uses]
        with:
          category: "integration"
          # Remove this 'ignore' key when you have added brand images for your integration to https://github.com/home-assistant/brands
#          ignore: "brands"
