[tox]
minversion = 4.0
env_list =
    py314
    lint
isolated_build = True

[testenv]
description = run unit tests
deps =
    pytest
    pytest-asyncio
    pytest-homeassistant-custom-component
commands =
    pytest {posargs:tests}

[testenv:lint]
description = run linters
skip_install = true
deps =
    ruff
commands =
    ruff check {posargs:.}
    ruff format --check {posargs:.}
