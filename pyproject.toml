[project]
name = "hass-gaggiuino"
version = "2026.11.1"  # Do not forget to change this in the manifest.json
description = "Home Assistant HACS Integration for Gagggiuino"
readme = "README.md"
requires-python = ">=3.14.2"  # follows https://github.com/home-assistant/core/blob/dev/pyproject.toml#L25
dependencies = [
    "gaggiuino-api==1.0.0",  # Do not forget to change this in the manifest.json
]

[dependency-groups]
dev = [
    "homeassistant",
    "pytest-asyncio",
    "pre-commit-uv",
    "pytest-homeassistant-custom-component",
]

[tool.setuptools]
packages = ["custom_components.gaggiuino"]

[tool.pytest.ini_options]
minversion = "8.3.5"
addopts = "-ra -q -m 'not e2e'"
pythonpath = ["."]
testpaths = ["tests"]
timeout = 30
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: marks tests as end-to-end tests that require a real machine on the network (deselect with '-m \"not e2e\"')",
]
